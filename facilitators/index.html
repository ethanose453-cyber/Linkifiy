<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انضم إلى شبكة مؤطري Linkify</title>
  <meta name="description" content="انضم إلى شبكة مؤطري Linkify وقدّم Workshops تعليمية وتفاعلية داخل المؤسسات التعليمية الخاصة." />
  <link rel="canonical" href="https://linkify.ma/facilitators" />

  <meta property="og:title" content="انضم إلى شبكة مؤطري Linkify" />
  <meta property="og:description" content="حوّل خبرتك ومهاراتك إلى Workshops داخل المؤسسات التعليمية الخاصة." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://linkify.ma/facilitators" />
  <meta property="og:site_name" content="Linkify.ma" />
  <meta property="og:locale" content="ar_MA" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand: #126cb4;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e5e7eb;
      --header-h: 68px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Tajawal", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 8px rgba(16,24,40,.04);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      width: 120px;
      max-height: 42px;
      object-fit: contain;
      display: block;
    }

    .official {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .official svg {
      width: 17px;
      height: 17px;
      color: var(--brand);
      flex: 0 0 auto;
    }

    .frame-shell {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-h));
      height: calc(100dvh - var(--header-h));
      background: var(--bg);
    }

    .facilitator-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      z-index: 2;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      min-width: 250px;
      padding: 22px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(16,24,40,.08);
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #e5eef7;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loader-card strong { display: block; margin-bottom: 4px; }
    .loader-card span { color: var(--muted); font-size: 13px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      :root { --header-h: 60px; }
      .topbar { padding: 0 14px; }
      .brand img { width: 104px; }
      .official { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://linkify.ma" aria-label="العودة إلى Linkify.ma">
      <img src="/logo-light.png" alt="Linkify.ma" />
    </a>

    <div class="official" aria-label="النموذج الرسمي لشبكة مؤطري Linkify">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>النموذج الرسمي لشبكة مؤطري Linkify</span>
    </div>
  </header>

  <main class="frame-shell">
    <div class="loader" id="frameLoader" aria-live="polite">
      <div class="loader-card">
        <div class="spinner" aria-hidden="true"></div>
        <strong>جاري تحميل استمارة التسجيل</strong>
        <span>Linkify Facilitator Network</span>
      </div>
    </div>

    <iframe
      id="facilitatorFrame"
      class="facilitator-frame"
      title="استمارة التسجيل في شبكة مؤطري Linkify"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-write"
    ></iframe>
  </main>

  <script>
    (function () {
      var WEB_APP = 'https://script.google.com/macros/s/AKfycby85kSHqUNl_Df0kmK7KClT74_HA_xqO9YgzfmBGlirkIDhUye2vgXUNZMlpt7cmGoE/exec';
      var frame = document.getElementById('facilitatorFrame');
      var loader = document.getElementById('frameLoader');

      try {
        var incoming = new URLSearchParams(window.location.search);
        var target = new URL(WEB_APP);

        incoming.forEach(function (value, key) {
          target.searchParams.set(key, value);
        });

        if (!target.searchParams.get('source')) {
          target.searchParams.set('source', 'linkify.ma/facilitators');
        }

        frame.src = target.toString();
      } catch (e) {
        frame.src = WEB_APP + '?source=linkify.ma%2Ffacilitators';
      }

      frame.addEventListener('load', function () {
        loader.classList.add('hidden');
      });

      setTimeout(function () {
        loader.classList.add('hidden');
      }, 7000);
    })();
  </script>
</body>
</html>
